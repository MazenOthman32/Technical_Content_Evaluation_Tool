<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقارير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea;
  --ink: #1c1915;
  --muted: #6f6a62;
  --line: #e3ddd2;
  --card: #fffcf7;
  --soft: #efeae1;
  --danger: #8d2b22;
  --major: #9b2c2c;
  --moderate: #9a5b12;
  --minor: #1d4e89;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(900px 280px at 100% -40px, #efe6d4 0, transparent 60%),
    var(--bg);
  color: var(--ink);
  font: 16px/1.55 "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
.page { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 80px }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px }
h1 { margin: 0; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.03em }
.back {
  border: 1px solid var(--line);
  background: var(--card);
  color: inherit;
  text-decoration: none;
  border-radius: 999px;
  padding: 8px 14px;
  font: inherit;
}
.back:hover { border-color: #cfc6b8 }
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 16px 40px rgba(40, 32, 18, .04);
}
.field { display: block; margin: 0 0 12px }
.field-label { display: block; margin-bottom: 6px; font-size: .82rem; color: var(--muted) }
.composer { display: flex; gap: 8px; margin-top: 6px }
input {
  width: 100%;
  border: 1px solid #ddd6c8;
  background: #fff;
  border-radius: 12px;
  padding: 13px 14px;
  font: inherit;
  color: var(--ink);
  outline: none;
}
input:focus { border-color: #1c1915; box-shadow: 0 0 0 4px rgba(28, 25, 21, .08) }
#source { direction: ltr; text-align: left }
.pick {
  border: 1px solid var(--line);
  background: var(--soft);
  border-radius: 12px;
  padding: 0 14px;
  min-height: 48px;
  font: inherit;
  cursor: pointer;
  color: var(--ink);
}
.pick:hover { background: #e7e0d4 }
.go {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 13px 16px;
  background: var(--ink);
  color: #f7f3ea;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.go:hover { background: #2a251f }
.go:disabled { opacity: .55; cursor: progress }
.error { margin: 10px 0 0; color: var(--danger); font-size: .92rem }
.status {
  margin: 10px 0 0;
  color: var(--muted);
  background: var(--soft);
  border-radius: 10px;
  padding: 8px 12px;
}
.section { margin-top: 28px }
.section h2 { margin: 0 0 10px; font-size: .95rem; font-weight: 600 }
.board { display: grid; gap: 8px }
.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  width: 100%;
  text-align: right;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  font: inherit;
  cursor: pointer;
}
.row:hover { border-color: #cfc6b8; background: #fff }
.row-title { font-weight: 500 }
.meta { color: var(--muted); font-size: .85rem; white-space: nowrap }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end }
.chip {
  font-size: .75rem;
  border-radius: 999px;
  padding: 2px 8px;
  background: var(--soft);
}
.chip.major { color: var(--major) }
.chip.moderate { color: var(--moderate) }
.chip.minor { color: var(--minor) }
.empty {
  padding: 22px 16px;
  text-align: center;
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: 14px;
}
@media (max-width: 640px) {
  .composer { flex-direction: column }
  .pick { width: 100% }
  .row { align-items: flex-start; flex-direction: column; gap: 8px }
  .chips { justify-content: flex-start }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1 id="title">التقارير</h1>
    <a class="back" id="back" href="#/" hidden>الكورسات</a>
  </div>

  <form id="desk" class="panel" autocomplete="off">
    <div class="field">
      <span class="field-label">الفيديو</span>
      <div class="composer">
        <input id="source" aria-label="الفيديو" placeholder="لينك أو مسار" required>
        <button class="pick" id="pick-file" type="button">ملف</button>
        <button class="pick" id="pick-dir" type="button">فولدر</button>
      </div>
    </div>
    <label class="field">
      <span class="field-label">الكورس</span>
      <input id="course" placeholder="اسم الكورس">
    </label>
    <button class="go" id="generate" type="submit">توليد التقرير</button>
    <p id="form-error" class="error" role="alert" hidden></p>
    <p id="status" class="status" aria-live="polite" hidden></p>
  </form>

  <section class="section">
    <h2 id="board-label">الكورسات</h2>
    <div class="board" id="board"></div>
  </section>
</div>
<script>
const state = { running: false, courses: [] };
const sourceEl = document.querySelector("#source");
const courseEl = document.querySelector("#course");
const errorEl = document.querySelector("#form-error");
const statusEl = document.querySelector("#status");
const boardEl = document.querySelector("#board");
const generateEl = document.querySelector("#generate");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[char]));
}

function reportCount(count) {
  if (count === 1) return "تقرير واحد";
  if (count === 2) return "تقريران";
  if (count >= 3 && count <= 10) return count + " تقارير";
  return count + " تقرير";
}

function showError(message) {
  errorEl.hidden = !message;
  errorEl.textContent = message || "";
}

function currentCourse() {
  const hash = location.hash.replace(/^#/, "");
  if (!hash.startsWith("course/")) return "";
  return decodeURIComponent(hash.slice("course/".length));
}

function openCourse(id) {
  location.hash = "course/" + encodeURIComponent(id);
}

async function browse(kind) {
  showError("");
  try {
    const res = await fetch("/api/browse", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({kind}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "الاختيار متعملش");
    if (data.path) sourceEl.value = data.path;
  } catch (err) {
    showError(err.message);
  }
}

function chips(item) {
  const parts = [];
  if (item.major) parts.push(`<span class="chip major">${item.major} جوهري</span>`);
  if (item.moderate) parts.push(`<span class="chip moderate">${item.moderate} متوسط</span>`);
  if (item.minor) parts.push(`<span class="chip minor">${item.minor} بسيط</span>`);
  if (!parts.length) return `<span class="meta">بدون ملاحظات</span>`;
  return `<span class="chips">${parts.join("")}</span>`;
}

function render() {
  const id = currentCourse();
  const course = state.courses.find(item => item.id === id);
  document.querySelector("#title").textContent = course ? course.title : "التقارير";
  document.querySelector("#back").hidden = !course;
  document.querySelector("#board-label").hidden = Boolean(course);
  courseEl.value = course ? course.title : "";
  if (!course) {
    boardEl.innerHTML = state.courses.length
      ? state.courses.map(item => `
          <button class="row" type="button" data-id="${escapeHtml(item.id)}">
            <span class="row-title">${escapeHtml(item.title)}</span>
            <span class="meta">${reportCount(item.count)}</span>
          </button>`).join("")
      : `<p class="empty">لسه مفيش تقارير</p>`;
    boardEl.querySelectorAll("[data-id]").forEach(button => {
      button.addEventListener("click", () => openCourse(button.dataset.id));
    });
    return;
  }
  boardEl.innerHTML = course.reports.length
    ? course.reports.map(item => `
        <a class="row" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
          <span class="row-title">${escapeHtml(item.title)}</span>
          ${chips(item)}
        </a>`).join("")
    : `<p class="empty">الكورس ده لسه من غير تقارير</p>`;
}

async function loadCourses() {
  const res = await fetch("/api/status");
  const data = await res.json();
  state.courses = data.courses || [];
  render();
}

async function poll(id) {
  let since = 0;
  while (state.running) {
    const res = await fetch(`/api/jobs/${id}?since=${since}`);
    const data = await res.json();
    if (data.logs?.length) {
      statusEl.hidden = false;
      statusEl.textContent = data.logs[data.logs.length - 1];
      since = data.next;
    }
    if (data.status === "running") {
      await new Promise(resolve => setTimeout(resolve, 900));
      continue;
    }
    state.running = false;
    generateEl.disabled = false;
    generateEl.textContent = "توليد التقرير";
    if (data.status === "done") {
      statusEl.textContent = "التقرير جاهز";
      await loadCourses();
      if (data.result?.course_id) openCourse(data.result.course_id);
    } else {
      statusEl.hidden = true;
      showError(data.error || "حصلت مشكلة أثناء التشغيل.");
    }
  }
}

document.querySelector("#pick-file").addEventListener("click", () => browse("file"));
document.querySelector("#pick-dir").addEventListener("click", () => browse("dir"));
document.querySelector("#back").addEventListener("click", event => {
  event.preventDefault();
  courseEl.value = "";
  location.hash = "/";
});
window.addEventListener("hashchange", render);
document.querySelector("#desk").addEventListener("submit", async event => {
  event.preventDefault();
  if (state.running) return;
  const value = sourceEl.value.trim();
  if (!value) return;
  showError("");
  statusEl.hidden = false;
  statusEl.textContent = "بيشتغل";
  generateEl.disabled = true;
  generateEl.textContent = "جاري التوليد";
  const opened = currentCourse();
  const courseName = courseEl.value.trim() || (state.courses.find(item => item.id === opened)?.title || "");
  try {
    const res = await fetch("/api/jobs", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        sources: [{kind: /^https?:\/\//i.test(value) ? "link" : "path", value}],
        topic: courseName,
        batch_name: courseName,
        min_confidence: 0.75,
        verify: true,
        retranscribe: false,
        save_keys: false,
        keys: {},
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "مقدرناش نبدأ");
    state.running = true;
    await poll(data.id);
  } catch (err) {
    state.running = false;
    generateEl.disabled = false;
    generateEl.textContent = "توليد التقرير";
    statusEl.hidden = true;
    showError(err.message);
  }
});

loadCourses();
</script>
</body>
</html>
